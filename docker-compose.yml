services:
  vst-creator:
    build: .
    ports:
      - "80:8000"
    env_file: .env
    environment:
      # Overrides any DATABASE_URL in .env (that one is for running the app outside Docker).
      DATABASE_URL: postgresql://vst:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/vst
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vst
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vst
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # loopback only: for running the app outside Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vst -d vst"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
