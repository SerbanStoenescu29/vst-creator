<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VST3 Creator</title>
<style>
  :root {
    --bg1:#0b1020; --bg2:#1a1140; --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
    --text:#eef0ff; --muted:#9aa3d1; --accent:#7c5cff; --accent2:#22d3ee; --hot:#ff4d8d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #2a1a6e 0%, transparent 60%),
                linear-gradient(180deg, var(--bg2), var(--bg1) 70%);
    display: flex; flex-direction: column; overflow: hidden;
  }
  header { padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .3px; }
  .brand i { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg,var(--accent2),var(--hot)); box-shadow: 0 0 12px var(--accent2); }
  .brand small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .drawer { position: fixed; top: 0; bottom: 0; left: 0; z-index: 8; width: 300px; max-width: 86vw; padding: 64px 12px 12px; overflow-y: auto;
    background: #12162f; border-right: 1px solid var(--line); box-shadow: 10px 0 40px rgba(0,0,0,.45); transform: translateX(-102%); transition: transform .2s ease; }
  .drawer.open { transform: none; }
  .drawer h3 { margin: 0 8px 10px; font-size: 13px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
  .drawer ul { list-style: none; margin: 0; padding: 0; }
  .drawer li button { display: block; width: 100%; text-align: left; padding: 9px 12px; margin-bottom: 4px; border: 0; border-radius: 10px;
    background: none; color: var(--text); font: inherit; font-size: 14px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drawer li button:hover, .drawer li button.current { background: var(--card); }
  .drawer .empty { padding: 8px 12px; color: var(--muted); font-size: 14px; }
  .state-badge { position: fixed; left: 20px; top: 84px; z-index: 2; padding: 10px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line);
    backdrop-filter: blur(6px); min-width: 150px; }
  .state-badge small { display: block; font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
  .state-badge code { display: flex; align-items: center; gap: 8px; margin-top: 2px; font: 600 14px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--accent2); }
  .state-badge code::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }
  body.working .state-badge code::before { animation: pulse .8s infinite; }
  @media (max-width: 1100px) { .state-badge { position: static; margin: 0 20px 4px; align-self: flex-start; } }
  .who { color: var(--muted); font-size: 14px; margin-right: 10px; }
  .actions { display: flex; align-items: center; gap: 8px; }
  header button { background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 6px 16px; cursor: pointer; }
  header button:hover { border-color: var(--accent2); }

  /* ---- stage with the robot ---- */
  .stage { position: relative; height: 230px; flex: none; display: flex; justify-content: center; align-items: flex-end; }
  .stage::after { content:""; position:absolute; bottom: 6px; left:50%; width: 340px; height: 38px; transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(124,92,255,.55), transparent); filter: blur(6px); }
  .eq { position:absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display:flex; gap:6px; align-items:flex-end; height: 120px; width: 420px; justify-content: space-between; opacity:.35; }
  .eq b { flex:1; border-radius: 4px 4px 0 0; background: linear-gradient(180deg,var(--accent2),var(--accent)); height: 20%; animation: eq 2.8s ease-in-out infinite; }
  .eq b:nth-child(3n) { animation-duration: 2.2s; } .eq b:nth-child(4n) { animation-duration: 3.4s; background: linear-gradient(180deg,var(--hot),var(--accent)); }
  .eq b:nth-child(odd) { animation-delay: -.5s; } .eq b:nth-child(5n) { animation-delay: -.9s; }
  @keyframes eq { 0%,100% { height: 14%; } 50% { height: 70%; } }
  body.working .eq b { animation-duration: 1.3s; }
  .robot { position: relative; z-index: 1; width: 260px; height: 220px; overflow: visible; animation: bob 2.4s ease-in-out infinite; }
  body.working .robot { animation-duration: .8s; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
  @keyframes blink { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  .antenna-dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.4; } 50% { opacity:1; } }
  .strum { transform-box: view-box; transform-origin: 168px 96px; animation: strum 1.3s ease-in-out infinite; }
  body.working .strum { animation-duration: .35s; }
  @keyframes strum { 0%,100% { transform: rotate(-9deg); } 50% { transform: rotate(11deg); } }
  .sway { transform-box: view-box; transform-origin: 130px 120px; animation: sway 2.4s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
  .note { font-size: 20px; fill: var(--accent2); opacity: 0; animation: float 3.4s ease-in infinite; }
  .note.n2 { fill: var(--hot); animation-delay: 1.1s; } .note.n3 { fill: #ffd166; animation-delay: 2.2s; }
  body.working .note { animation-duration: 1.8s; }
  @keyframes float { 0% { opacity:0; transform: translate(0,0) rotate(0); } 15% { opacity:1; } 100% { opacity:0; transform: translate(22px,-90px) rotate(18deg); } }
  body.celebrate .robot { animation: jump .7s ease-in-out infinite; }
  @keyframes jump { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }

  /* ---- chat ---- */
  #log { flex: 1; overflow-y: auto; padding: 8px 16px 12px; scroll-behavior: smooth; }
  .row { max-width: 760px; margin: 0 auto 14px; display: flex; animation: in .25s ease-out; }
  @keyframes in { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
  .row.user { justify-content: flex-end; }
  .msg { padding: 11px 18px; border-radius: 20px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot .msg { background: var(--card); border: 1px solid var(--line); border-top-left-radius: 6px; backdrop-filter: blur(6px); }
  .user .msg { background: linear-gradient(135deg, var(--accent), #5b8cff); border-top-right-radius: 6px; box-shadow: 0 6px 20px rgba(124,92,255,.35); }
  .typing { color: var(--muted); }
  .typing::before { content:""; display:inline-block; width:8px; height:8px; margin-right:8px; border-radius:50%; background: var(--accent2); animation: pulse 1s infinite; }
  .download { display:inline-block; margin-top:10px; padding:9px 18px; border-radius:12px; color:#fff; font-weight:600; text-decoration:none;
    background: linear-gradient(135deg,var(--accent2),var(--accent)); box-shadow: 0 6px 20px rgba(34,211,238,.3); }
  .download:hover { filter: brightness(1.1); }
  .msg.failed { border-color: var(--hot); }
  .retry { margin-top: 10px; padding: 7px 16px; border-radius: 10px; border: 1px solid var(--hot); background: none; color: var(--text, #fff); font-weight: 600; cursor: pointer; }
  .retry:hover { background: rgba(255,255,255,.08); }
  .report { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 14px; background: rgba(255,255,255,.03); }
  .report summary { cursor: pointer; font-weight: 600; }
  .report .badge { display: inline-block; margin-left: 8px; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .report .badge.review { background: #ffd166; color: #2b2100; }
  .report .badge.ok { background: rgba(34,211,238,.2); color: var(--accent2); }
  .report h4 { margin: 10px 0 4px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .report ul { margin: 0; padding-left: 18px; }
  .report code { font-size: 12px; color: var(--accent2); }
  .report .score { color: var(--muted); font-size: 12px; }
  form { max-width: 760px; width: 100%; margin: 0 auto; padding: 0 16px 20px; }
  .box { display: flex; gap: 8px; align-items: flex-end; background: var(--card); border: 1px solid var(--line); border-radius: 26px; padding: 8px 8px 8px 20px; }
  .box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,92,255,.25); }
  #attach { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 0; background: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  #attach:hover { color: var(--accent2); background: var(--card); }
  #attach:disabled { opacity: .4; cursor: default; }
  #attach[hidden] { display: none; }
  #preview { display: flex; align-items: center; gap: 10px; margin: 0 0 8px 8px; }
  #preview[hidden] { display: none; }
  #preview img { height: 56px; max-width: 120px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
  #preview button { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; line-height: 1; }
  .msg img.pic { display: block; max-width: 100%; max-height: 220px; border-radius: 12px; margin-bottom: 6px; }
  textarea { flex: 1; resize: none; max-height: 200px; background: none; border: 0; outline: 0; color: var(--text); font: inherit; padding: 6px 0; }
  textarea::placeholder { color: var(--muted); }
  #send { width: 40px; height: 40px; border-radius: 50%; border: 0; background: linear-gradient(135deg,var(--accent2),var(--accent)); color: #fff; font-size: 18px; cursor: pointer; }
  #send:disabled, textarea:disabled { opacity: .4; cursor: default; }
  /* ---- sign in / sign up ---- */
  .auth { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(8,10,25,.78); backdrop-filter: blur(8px); }
  .auth[hidden] { display: none; }
  .card { width: 100%; max-width: 380px; padding: 28px; border-radius: 22px; background: #151a38; border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .card h2 { margin: 0 0 4px; font-size: 22px; }
  .card p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .card label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .card input { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text); font: inherit; outline: 0; }
  .card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,92,255,.25); }
  .card .primary { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 12px; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    background: linear-gradient(135deg,var(--accent2),var(--accent)); }
  .card .primary:disabled { opacity: .5; cursor: default; }
  .card .switch { margin: 16px 0 0; text-align: center; font-size: 14px; }
  .card .switch button { background: none; border: 0; padding: 0; color: var(--accent2); cursor: pointer; font: inherit; }
  .error { min-height: 20px; margin-top: 12px; color: #ff7a9c; font-size: 14px; }
  @media (max-height: 640px) { .stage { height: 150px; } .robot { transform-origin: bottom; scale: .65; } .eq { height: 80px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<header>
  <div class="brand"><i></i>VST3 Creator<small>For educational purposes only, non-commercial</small></div>
  <div class="actions">
    <span class="who" id="who"></span>
    <button id="history" type="button">History</button>
    <button id="new" type="button">New chat</button>
    <button id="logout" type="button">Sign out</button>
  </div>
</header>

<aside class="drawer" id="drawer" aria-label="Saved conversations"><h3>Conversations</h3><ul id="convList"></ul></aside>

<div class="auth" id="auth" hidden>
  <form class="card" id="authForm" autocomplete="on">
    <h2 id="authTitle">Sign in</h2>
    <p id="authSub">Welcome back. Sign in to build your plugin.</p>
    <label for="username">Username</label>
    <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="32" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" minlength="8" required>
    <div class="error" id="authError" role="alert"></div>
    <button class="primary" id="authSubmit" type="submit">Sign in</button>
    <p class="switch"><span id="switchText">No account yet?</span> <button type="button" id="switchMode">Create one</button></p>
  </form>
</div>

<div class="state-badge" title="The graph node the conversation is in"><small>Graph state</small><code id="graphState">—</code></div>

<div class="stage" aria-hidden="true">
  <div class="eq"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div>
  <svg class="robot" viewBox="0 0 260 220" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6ebff"/><stop offset="1" stop-color="#9aa8e8"/></linearGradient>
      <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f7a"/><stop offset="1" stop-color="#1c2050"/></linearGradient>
      <linearGradient id="gbody" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#ff9b3d"/></linearGradient>
      <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c58a4a"/><stop offset="1" stop-color="#8b5a2b"/></linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>

    <!-- floating notes -->
    <text class="note" x="60" y="70">♪</text>
    <text class="note n2" x="200" y="80">♫</text>
    <text class="note n3" x="30" y="110">♪</text>

    <!-- legs -->
    <rect x="104" y="150" width="15" height="40" rx="6" fill="url(#dark)"/>
    <rect x="141" y="150" width="15" height="40" rx="6" fill="url(#dark)"/>
    <rect x="98" y="184" width="27" height="14" rx="7" fill="#242a68"/>
    <rect x="135" y="184" width="27" height="14" rx="7" fill="#242a68"/>

    <!-- torso -->
    <rect x="92" y="80" width="76" height="74" rx="20" fill="url(#metal)"/>
    <circle cx="130" cy="108" r="11" fill="#0b1020"/>
    <circle class="antenna-dot" cx="130" cy="108" r="6" fill="#22d3ee" filter="url(#glow)"/>
    <rect x="108" y="130" width="44" height="5" rx="2.5" fill="#7c5cff" opacity=".6"/>

    <!-- head -->
    <line x1="130" y1="22" x2="130" y2="9" stroke="#9aa8e8" stroke-width="3" stroke-linecap="round"/>
    <circle class="antenna-dot" cx="130" cy="7" r="5" fill="#ff4d8d" filter="url(#glow)"/>
    <rect x="86" y="38" width="9" height="22" rx="4" fill="#7c5cff"/>
    <rect x="165" y="38" width="9" height="22" rx="4" fill="#7c5cff"/>
    <rect x="94" y="20" width="72" height="58" rx="18" fill="url(#metal)"/>
    <rect x="102" y="32" width="56" height="28" rx="12" fill="#0b1020"/>
    <ellipse class="blink" cx="118" cy="46" rx="6" ry="7" fill="#22d3ee" filter="url(#glow)"/>
    <ellipse class="blink" cx="142" cy="46" rx="6" ry="7" fill="#22d3ee" filter="url(#glow)"/>
    <rect x="118" y="66" width="24" height="4" rx="2" fill="#7c5cff"/>
    <rect x="122" y="76" width="16" height="8" rx="3" fill="#9aa8e8"/>

    <!-- guitar (strapped across the body), swaying a little -->
    <g class="sway">
      <g transform="rotate(24 140 128)">
        <!-- neck and headstock -->
        <rect x="20" y="123" width="124" height="10" rx="2" fill="url(#wood)"/>
        <rect x="20" y="123" width="124" height="4" rx="2" fill="#2a1a10" opacity=".55"/>
        <path d="M20 121 L2 116 Q-2 126 2 140 L20 135 Z" fill="#2a1a10"/>
        <circle cx="8" cy="120" r="2" fill="#ffd166"/><circle cx="8" cy="128" r="2" fill="#ffd166"/><circle cx="8" cy="136" r="2" fill="#ffd166"/>
        <g stroke="#ffd166" stroke-width="1" opacity=".8"><line x1="48" y1="123" x2="48" y2="133"/><line x1="72" y1="123" x2="72" y2="133"/><line x1="94" y1="123" x2="94" y2="133"/><line x1="114" y1="123" x2="114" y2="133"/></g>
        <!-- body: Flying V -->
        <path d="M138 120 L206 94 L216 106 L172 128 L216 152 L206 164 L138 136 Z" fill="url(#gbody)" stroke="#7a1f4a" stroke-width="2" stroke-linejoin="round"/>
        <rect x="148" y="121" width="5" height="14" rx="1.5" fill="#1c1c28"/>
        <rect x="159" y="118" width="5" height="20" rx="1.5" fill="#1c1c28"/>
        <rect x="167" y="121" width="4" height="14" rx="1.5" fill="#c9cde0"/>
        <circle cx="184" cy="112" r="3.5" fill="#c9cde0"/><circle cx="194" cy="106" r="3.5" fill="#c9cde0"/>
        <g stroke="#e8ebff" stroke-width=".8" opacity=".9">
          <line x1="20" y1="125" x2="170" y2="121"/><line x1="20" y1="128" x2="170" y2="127"/><line x1="20" y1="131" x2="170" y2="133"/>
        </g>
      </g>
      <!-- strap -->
      <path d="M104 82 L152 138" stroke="#ff4d8d" stroke-width="4" opacity=".75" stroke-linecap="round"/>
    </g>

    <!-- left arm: holds the neck -->
    <path d="M96 94 Q84 122 67 99" stroke="url(#dark)" stroke-width="11" stroke-linecap="round" fill="none"/>
    <circle cx="66" cy="97" r="8" fill="#9aa8e8"/>

    <!-- right arm: strumming -->
    <g class="strum">
      <path d="M166 94 Q188 118 170 142" stroke="url(#dark)" stroke-width="11" stroke-linecap="round" fill="none"/>
      <circle cx="169" cy="145" r="8" fill="#9aa8e8"/>
    </g>
  </svg>
</div>

<div id="log"></div>
<form id="form">
  <div id="preview" hidden><img id="previewImg" alt="Attached picture"><button id="removeImg" type="button" aria-label="Remove picture">×</button></div>
  <div class="box">
    <input id="file" type="file" accept="image/*" hidden>
    <button id="attach" type="button" aria-label="Attach a picture" title="Attach a picture" hidden>📎</button>
    <textarea id="input" rows="1" placeholder="Describe the VST3 plugin you want…" autofocus></textarea>
    <button id="send" type="submit" aria-label="Send">↑</button>
  </div>
</form>
<script>
const log = document.getElementById("log"), input = document.getElementById("input"),
      send = document.getElementById("send");
const attach = document.getElementById("attach"), fileEl = document.getElementById("file"),
      preview = document.getElementById("preview"), previewImg = document.getElementById("previewImg");
let threadId = null, busy = false, done = false, attached = null;

function add(role, text) {
  const row = document.createElement("div");
  row.className = "row " + role;
  const m = document.createElement("div");
  m.className = "msg";
  m.textContent = text;
  row.appendChild(m);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return m;
}

function setNode(name) {
  document.getElementById("graphState").textContent = name || "—";
  // The paperclip only appears while the graph is waiting for the UI picture.
  const wanted = name === "ask_image";
  if (attach.hidden === wanted) { attach.hidden = !wanted; if (!wanted) clearAttachment(); }
}

function addReport(m, report) {
  if (!report) return;
  const box = document.createElement("details");
  box.className = "report";
  if (report.review) box.open = true;
  const sum = document.createElement("summary");
  sum.textContent = "Sources and notes";
  const badge = document.createElement("span");
  badge.className = "badge " + (report.review ? "review" : "ok");
  badge.textContent = report.review ? "needs human review" : "no issues flagged";
  sum.appendChild(badge);
  box.appendChild(sum);
  const section = (title, items, render) => {
    if (!items || !items.length) return;
    const h = document.createElement("h4"); h.textContent = title; box.appendChild(h);
    const ul = document.createElement("ul");
    for (const it of items) { const li = document.createElement("li"); render(li, it); ul.appendChild(li); }
    box.appendChild(ul);
  };
  const text = (li, it) => { li.textContent = it; };
  section("Why review is recommended", report.review_reasons, text);
  section("Assumed by the model", report.assumptions, text);
  section("Never specified", report.missing, text);
  section("Used without documentation", report.ungrounded, text);
  section("JUCE docs used", report.sources, (li, it) => {
    const c = document.createElement("code"); c.textContent = it.file; li.appendChild(c);
    const sc = document.createElement("span"); sc.className = "score"; sc.textContent = "  match " + Math.round(it.score * 100) + "%"; li.appendChild(sc);
  });
  m.appendChild(box);
}

function addDownload(m, id) {
  const a = document.createElement("a");
  a.href = "/api/download/" + id;
  a.textContent = "Download VST3 plugin (zip)";
  a.className = "download";
  m.appendChild(document.createElement("br"));
  m.appendChild(a);
}

function setBusy(b) {
  busy = b;
  send.disabled = b || done;
  input.disabled = done;
  attach.disabled = done;
  document.body.classList.toggle("working", b);
  document.body.classList.toggle("celebrate", !b && done);
}

async function call(message, image, retry) {
  setBusy(true);
  const t = add("bot", "…"); t.classList.add("typing");
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ thread_id: threadId, message, image: image || null, retry: !!retry }),
    });
    if (r.status === 401) { t.closest(".row").remove(); setBusy(false); showAuth(); return; }
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "", final = null;
    const handle = line => {
      if (!line.trim()) return;
      const ev = JSON.parse(line);
      if (ev.node) setNode(ev.node);
      else if (ev.status) { t.textContent = ev.status + "…"; log.scrollTop = log.scrollHeight; }
      else if (ev.error) { const err = new Error(ev.error); err.retryable = !!ev.retryable; throw err; }
      else if (ev.final) final = ev.final;
    };
    for (;;) {
      const { value, done: eof } = await reader.read();
      if (eof) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      lines.forEach(handle);
    }
    handle(buf);
    if (!final) throw new Error("No response");
    threadId = final.thread_id;
    done = final.done;
    setNode(final.node);
    t.classList.remove("typing");
    t.textContent = final.reply;
    if (final.download_url) addDownload(t, final.thread_id);
    if (final.done) addReport(t, final.report);
  } catch (e) {
    t.classList.remove("typing");
    t.classList.add("failed");
    t.textContent = e.message;
    if (e.retryable && threadId) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "retry"; b.textContent = "Try again";
      b.addEventListener("click", () => { t.closest(".row").remove(); call(null, null, true); });
      t.appendChild(document.createElement("br")); t.appendChild(b);
    }
  }
  setBusy(false);
  if (!done) input.focus();
  log.scrollTop = log.scrollHeight;
  loadList();
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const text = input.value.trim();
  if ((!text && !attached) || busy || done) return;
  const image = attached;
  input.value = ""; input.style.height = "auto";
  const m = add("user", text);
  if (image) {
    const pic = document.createElement("img");
    pic.className = "pic"; pic.src = image; pic.alt = "Attached picture";
    m.prepend(pic);
  }
  clearAttachment();
  call(text, image);
});

// ---- picture attachment: downscaled in the browser before it is sent ----
function clearAttachment() { attached = null; preview.hidden = true; previewImg.removeAttribute("src"); fileEl.value = ""; }
attach.addEventListener("click", () => fileEl.click());
document.getElementById("removeImg").addEventListener("click", clearAttachment);
fileEl.addEventListener("change", () => {
  const f = fileEl.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => {
    const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    attached = c.toDataURL("image/jpeg", 0.88);
    previewImg.src = attached; preview.hidden = false;
    URL.revokeObjectURL(url);
  };
  img.onerror = () => { URL.revokeObjectURL(url); clearAttachment(); alert("That file could not be read as a picture."); };
  img.src = url;
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); }
});
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
// ---- saved conversations ----
const drawer = document.getElementById("drawer"), convList = document.getElementById("convList");

async function loadList() {
  const r = await fetch("/api/conversations");
  if (!r.ok) return;
  const items = await r.json();
  convList.innerHTML = "";
  if (!items.length) { convList.innerHTML = '<li class="empty">No conversations yet.</li>'; return; }
  for (const c of items) {
    const li = document.createElement("li"), b = document.createElement("button");
    b.textContent = c.title; b.title = c.title;
    if (c.id === threadId) b.className = "current";
    b.addEventListener("click", () => openConversation(c.id));
    li.appendChild(b); convList.appendChild(li);
  }
}

async function openConversation(id) {
  if (busy) return;
  const r = await fetch("/api/conversations/" + id);
  if (r.status === 401) { showAuth(); return; }
  if (!r.ok) return;
  const c = await r.json();
  resetChat();
  for (const m of c.messages) {
    const el = add(m.role === "user" ? "user" : "bot", m.content);
    if (m.download) addDownload(el, c.id);
    addReport(el, m.report);
  }
  threadId = c.id;
  done = !c.active;
  setNode(c.node);
  if (done && !c.messages.some(m => m.download)) add("bot", "This conversation has ended. Start a new chat to build another plugin.");
  setBusy(false);
  drawer.classList.remove("open");
  loadList();
}

document.getElementById("history").addEventListener("click", () => { drawer.classList.toggle("open"); if (drawer.classList.contains("open")) loadList(); });
document.addEventListener("click", e => {
  if (drawer.classList.contains("open") && !drawer.contains(e.target) && e.target.id !== "history") drawer.classList.remove("open");
});

function resetChat() { setNode(""); log.innerHTML = ""; threadId = null; done = false; clearAttachment(); setBusy(false); }
document.getElementById("new").addEventListener("click", () => { drawer.classList.remove("open"); resetChat(); call(null); });

// ---- accounts ----
const authEl = document.getElementById("auth"), authForm = document.getElementById("authForm"),
      authError = document.getElementById("authError"), userEl = document.getElementById("username"),
      passEl = document.getElementById("password"), who = document.getElementById("who");
let signup = false;

function setMode(isSignup) {
  signup = isSignup;
  document.getElementById("authTitle").textContent = signup ? "Create account" : "Sign in";
  document.getElementById("authSub").textContent = signup ? "Create an account to start building plugins." : "Welcome back. Sign in to build your plugin.";
  document.getElementById("authSubmit").textContent = signup ? "Create account" : "Sign in";
  document.getElementById("switchText").textContent = signup ? "Already have an account?" : "No account yet?";
  document.getElementById("switchMode").textContent = signup ? "Sign in" : "Create one";
  passEl.autocomplete = signup ? "new-password" : "current-password";
  authError.textContent = "";
}
function showAuth() { who.textContent = ""; authEl.hidden = false; passEl.value = ""; userEl.focus(); }
function enterApp(username) { authEl.hidden = true; who.textContent = username; resetChat(); call(null); }

document.getElementById("switchMode").addEventListener("click", () => setMode(!signup));
authForm.addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("authSubmit");
  btn.disabled = true; authError.textContent = "";
  try {
    const r = await fetch(signup ? "/api/signup" : "/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: userEl.value, password: passEl.value }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Something went wrong.");
    passEl.value = "";
    enterApp(d.username);
  } catch (err) {
    authError.textContent = err.message;
  }
  btn.disabled = false;
});
document.getElementById("logout").addEventListener("click", async () => {
  await fetch("/api/logout", { method: "POST" });
  resetChat(); drawer.classList.remove("open"); convList.innerHTML = ""; showAuth();
});

(async function init() {
  const r = await fetch("/api/me");
  if (r.ok) enterApp((await r.json()).username); else showAuth();
})();
</script>
