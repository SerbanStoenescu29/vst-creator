<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VST3 Creator</title>
<style>
  :root { --bg:#212121; --panel:#2f2f2f; --text:#ececec; --muted:#9b9b9b; --accent:#10a37f; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#fff; --panel:#f4f4f4; --text:#1f1f1f; --muted:#6b6b6b; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { padding: 14px 20px; font-weight: 600; border-bottom: 1px solid rgba(128,128,128,.25); display:flex; justify-content:space-between; align-items:center; }
  header button { background: none; border: 1px solid rgba(128,128,128,.4); color: var(--text); border-radius: 8px; padding: 4px 12px; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .row { max-width: 760px; margin: 0 auto 20px; display: flex; }
  .row.user { justify-content: flex-end; }
  .msg { padding: 10px 16px; border-radius: 18px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user .msg { background: var(--panel); }
  .bot .msg { padding-left: 0; }
  .typing { color: var(--muted); }
  form { max-width: 760px; width: 100%; margin: 0 auto; padding: 0 16px 20px; }
  .box { display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border-radius: 24px; padding: 8px 8px 8px 18px; }
  textarea { flex: 1; resize: none; max-height: 200px; background: none; border: 0; outline: 0; color: var(--text); font: inherit; padding: 6px 0; }
  #send { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 18px; cursor: pointer; }
  #send:disabled, textarea:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<header><span>VST3 Creator</span><button id="new" type="button">New chat</button></header>
<div id="log"></div>
<form id="form">
  <div class="box">
    <textarea id="input" rows="1" placeholder="Describe the VST3 plugin you want…" autofocus></textarea>
    <button id="send" type="submit" aria-label="Send">↑</button>
  </div>
</form>
<script>
const log = document.getElementById("log"), input = document.getElementById("input"),
      send = document.getElementById("send");
let threadId = null, busy = false, done = false;

function add(role, text) {
  const row = document.createElement("div");
  row.className = "row " + role;
  const m = document.createElement("div");
  m.className = "msg";
  m.textContent = text;
  row.appendChild(m);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return m;
}

function setBusy(b) {
  busy = b;
  send.disabled = b || done;
  input.disabled = done;
}

async function call(message) {
  setBusy(true);
  const t = add("bot", "…"); t.classList.add("typing");
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ thread_id: threadId, message }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const d = await r.json();
    threadId = d.thread_id;
    done = d.done;
    t.classList.remove("typing");
    t.textContent = d.reply;
  } catch (e) {
    t.classList.remove("typing");
    t.textContent = "Error: " + e.message;
  }
  setBusy(false);
  if (!done) input.focus();
  log.scrollTop = log.scrollHeight;
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy || done) return;
  input.value = ""; input.style.height = "auto";
  add("user", text);
  call(text);
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); }
});
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
document.getElementById("new").addEventListener("click", () => {
  log.innerHTML = ""; threadId = null; done = false; setBusy(false); call(null);
});
call(null);
</script>
</body>
</html>
