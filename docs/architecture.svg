<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 810" width="1280" height="810" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#343a40"/>
    </marker>
    <marker id="arrow-iam" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e67700"/>
    </marker>
  </defs>

  <rect width="1280" height="810" fill="#ffffff"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#212529">VST3 Creator - architecture</text>
  <text x="40" y="62" font-size="12" fill="#868e96">Chat in, built Windows VST3 plugin out. One EC2 instance, three AWS services behind an IAM role, three external APIs.</text>

  <!-- browser -->
  <rect x="30" y="215" width="150" height="125" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
  <text x="105" y="245" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">User's browser</text>
  <text x="105" y="268" font-size="12" text-anchor="middle" fill="#495057">one HTML page</text>
  <text x="105" y="287" font-size="12" text-anchor="middle" fill="#495057">login · chat · history</text>
  <text x="105" y="306" font-size="12" text-anchor="middle" fill="#495057">sources · download</text>

  <!-- AWS region -->
  <rect x="250" y="70" width="500" height="520" rx="12" fill="#fff9f0" stroke="#e67700" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="264" y="92" font-size="13" font-weight="700" fill="#e67700">AWS · eu-north-1</text>

  <!-- EC2 -->
  <rect x="270" y="105" width="460" height="270" rx="10" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="285" y="127" font-size="13" font-weight="700" fill="#212529">EC2 instance · Ubuntu + Docker</text>
  <text x="285" y="143" font-size="11" fill="#868e96">Elastic IP · security group: port 80 public, SSH from one IP only</text>

  <rect x="290" y="155" width="420" height="125" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
  <text x="305" y="177" font-size="13" font-weight="700" fill="#212529">app container · FastAPI</text>
  <text x="305" y="198" font-size="12" fill="#495057">LangGraph flow · guardrails · structured spec</text>
  <text x="305" y="216" font-size="12" fill="#495057">RAG search over the JUCE 8.0.8 docs</text>
  <text x="305" y="234" font-size="12" fill="#495057">code-writing agent with tools</text>
  <text x="305" y="254" font-size="12" fill="#495057">accounts · chats · download redirect</text>

  <rect x="290" y="295" width="420" height="65" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="305" y="318" font-size="13" font-weight="700" fill="#212529">db container · PostgreSQL</text>
  <text x="305" y="338" font-size="12" fill="#495057">accounts · conversations · reports (on the encrypted disk)</text>
  <line x1="500" y1="280" x2="500" y2="295" stroke="#343a40" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- IAM role -->
  <rect x="270" y="392" width="460" height="40" rx="8" fill="#fff3bf" stroke="#e67700" stroke-width="1.5"/>
  <text x="500" y="410" font-size="12" font-weight="700" text-anchor="middle" fill="#212529">IAM role vst-creator-access · no stored keys</text>
  <text x="500" y="425" font-size="10.5" text-anchor="middle" fill="#495057">only this bucket, this secret and this log group · IMDSv2</text>
  <line x1="500" y1="375" x2="500" y2="392" stroke="#e67700" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow-iam)"/>
  <line x1="342" y1="432" x2="342" y2="470" stroke="#e67700" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow-iam)"/>
  <line x1="497" y1="432" x2="497" y2="470" stroke="#e67700" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow-iam)"/>
  <line x1="652" y1="432" x2="652" y2="470" stroke="#e67700" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow-iam)"/>

  <!-- S3, Secrets Manager, CloudWatch -->
  <rect x="270" y="470" width="145" height="100" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="342" y="492" font-size="13" font-weight="700" text-anchor="middle" fill="#212529">S3 bucket</text>
  <text x="342" y="509" font-size="10" text-anchor="middle" fill="#868e96">vst-creator-bucket</text>
  <text x="342" y="527" font-size="11.5" text-anchor="middle" fill="#495057">uploads/ pictures</text>
  <text x="342" y="543" font-size="11.5" text-anchor="middle" fill="#495057">plugins/ built zips</text>
  <text x="342" y="559" font-size="11.5" text-anchor="middle" fill="#495057">knowledge/ RAG index</text>

  <rect x="425" y="470" width="145" height="100" rx="8" fill="#fff0f6" stroke="#c2255c" stroke-width="1.5"/>
  <text x="497" y="492" font-size="13" font-weight="700" text-anchor="middle" fill="#212529">Secrets Manager</text>
  <text x="497" y="509" font-size="10" text-anchor="middle" fill="#868e96">vst-creator/app</text>
  <text x="497" y="527" font-size="11.5" text-anchor="middle" fill="#495057">OpenAI, Anthropic and</text>
  <text x="497" y="543" font-size="11.5" text-anchor="middle" fill="#495057">GitHub keys, read at</text>
  <text x="497" y="559" font-size="11.5" text-anchor="middle" fill="#495057">boot into a 600 .env</text>

  <rect x="580" y="470" width="145" height="100" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.5"/>
  <text x="652" y="492" font-size="13" font-weight="700" text-anchor="middle" fill="#212529">CloudWatch Logs</text>
  <text x="652" y="509" font-size="10" text-anchor="middle" fill="#868e96">/vst-creator/app</text>
  <text x="652" y="527" font-size="11.5" text-anchor="middle" fill="#495057">app + db streams</text>
  <text x="652" y="543" font-size="11.5" text-anchor="middle" fill="#495057">errors carry a</text>
  <text x="652" y="559" font-size="11.5" text-anchor="middle" fill="#495057">reference number</text>

  <!-- external services -->
  <text x="800" y="108" font-size="12" font-weight="700" fill="#495057">External services (HTTPS)</text>

  <rect x="800" y="120" width="240" height="95" rx="8" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="815" y="143" font-size="13" font-weight="700" fill="#212529">OpenAI API</text>
  <text x="815" y="163" font-size="12" fill="#495057">chat + spec extraction</text>
  <text x="815" y="180" font-size="12" fill="#495057">picture analysis · guardrails</text>
  <text x="815" y="197" font-size="12" fill="#495057">embeddings for the RAG search</text>

  <rect x="800" y="235" width="240" height="75" rx="8" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="815" y="258" font-size="13" font-weight="700" fill="#212529">Anthropic API</text>
  <text x="815" y="278" font-size="12" fill="#495057">code-writing agent (tool use)</text>
  <text x="815" y="295" font-size="12" fill="#495057">Claude Sonnet 5.5</text>

  <rect x="800" y="330" width="240" height="115" rx="8" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="815" y="353" font-size="13" font-weight="700" fill="#212529">GitHub</text>
  <text x="815" y="373" font-size="12" fill="#495057">project pushed to a branch</text>
  <text x="815" y="390" font-size="12" fill="#495057">Actions on windows-2022:</text>
  <text x="815" y="407" font-size="12" fill="#495057">CMake + Visual Studio 2022</text>
  <text x="815" y="428" font-size="12" fill="#495057">VST3 + Standalone zip artifact</text>

  <line x1="710" y1="175" x2="800" y2="167" stroke="#343a40" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="710" y1="225" x2="800" y2="272" stroke="#343a40" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="710" y1="262" x2="800" y2="385" stroke="#343a40" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- LangGraph flow -->
  <text x="40" y="630" font-size="14" font-weight="700" fill="#212529">LangGraph flow inside the app container</text>
  <g font-size="10.5" text-anchor="middle" fill="#212529">
    <g><rect x="40" y="650" width="92" height="34" rx="6" fill="#e7f5ff" stroke="#1971c2"/><text x="86" y="671">collect</text></g>
    <g><rect x="142" y="650" width="92" height="34" rx="6" fill="#e7f5ff" stroke="#1971c2"/><text x="188" y="671">assistant</text></g>
    <g><rect x="244" y="650" width="92" height="34" rx="6" fill="#e7f5ff" stroke="#1971c2"/><text x="290" y="671">ask_ui</text></g>
    <g><rect x="346" y="650" width="92" height="34" rx="6" fill="#e7f5ff" stroke="#1971c2"/><text x="392" y="671">ask_image</text></g>
    <g><rect x="448" y="650" width="92" height="34" rx="6" fill="#e7f5ff" stroke="#1971c2"/><text x="494" y="671">analyze_ui</text></g>
    <g><rect x="550" y="650" width="92" height="34" rx="6" fill="#e7f5ff" stroke="#1971c2"/><text x="596" y="671">fetch_sample</text></g>
    <g><rect x="652" y="650" width="92" height="34" rx="6" fill="#f3f0ff" stroke="#6741d9"/><text x="698" y="671">retrieve_docs</text></g>
    <g><rect x="754" y="650" width="92" height="34" rx="6" fill="#f3f0ff" stroke="#6741d9"/><text x="800" y="671">write_code</text></g>
    <g><rect x="856" y="650" width="92" height="34" rx="6" fill="#e7f5ff" stroke="#1971c2"/><text x="902" y="671">save_files</text></g>
    <g><rect x="958" y="650" width="92" height="34" rx="6" fill="#e7f5ff" stroke="#1971c2"/><text x="1004" y="671">build_plugin</text></g>
    <g><rect x="1060" y="650" width="92" height="34" rx="6" fill="#e7f5ff" stroke="#1971c2"/><text x="1106" y="671">wait_for_build</text></g>
    <g><rect x="1162" y="650" width="92" height="34" rx="6" fill="#ebfbee" stroke="#2f9e44"/><text x="1208" y="671">done</text></g>
  </g>
  <g font-size="10" text-anchor="middle" fill="#868e96">
    <text x="188" y="699">spec + guardrails</text>
    <text x="290" y="699">yes / no</text>
    <text x="392" y="699">picture</text>
    <text x="494" y="699">vision</text>
    <text x="698" y="699">RAG</text>
    <text x="800" y="699">agent + tools</text>
    <text x="1004" y="699">GitHub Actions</text>
    <text x="1106" y="699">up to 20 min</text>
    <text x="1208" y="699">zip + report</text>
  </g>
  <g stroke="#343a40" stroke-width="1.4" marker-end="url(#arrow)">
    <line x1="132" y1="667" x2="141" y2="667"/><line x1="234" y1="667" x2="243" y2="667"/><line x1="336" y1="667" x2="345" y2="667"/>
    <line x1="438" y1="667" x2="447" y2="667"/><line x1="540" y1="667" x2="549" y2="667"/><line x1="642" y1="667" x2="651" y2="667"/>
    <line x1="744" y1="667" x2="753" y2="667"/><line x1="846" y1="667" x2="855" y2="667"/><line x1="948" y1="667" x2="957" y2="667"/>
    <line x1="1050" y1="667" x2="1059" y2="667"/><line x1="1152" y1="667" x2="1161" y2="667"/>
  </g>
  <path d="M1106,706 L1106,724 L698,724 L698,707" fill="none" stroke="#c92a2a" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="902" y="741" font-size="10.5" text-anchor="middle" fill="#c92a2a">build failed: retry (max 3) with the compiler errors</text>

  <!-- browser <-> app (drawn last so the AWS box does not cover it) -->
  <line x1="180" y1="250" x2="288" y2="250" stroke="#343a40" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="184" y="241" font-size="11" fill="#343a40">HTTP :80</text>
  <text x="184" y="266" font-size="10" fill="#868e96">streamed</text>

  <text x="40" y="786" font-size="11" fill="#868e96">Solid arrows: requests and data. Dashed orange: access granted by the IAM role. Every message passes the guardrails (off-topic, NSFW, jailbreak) before the flow sees it.</text>
</svg>
